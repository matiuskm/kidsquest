# Tahap 1 (sebelum ada sertifikat): HTTP saja, cukup untuk uji lokal dan tantangan certbot.
server {
    listen 80;
    listen [::]:80;
    server_name kidsquest.zarvenio.id;

    root /var/www/kidsquest/public;
    index index.php;
    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location ~* \.wav$ {
        default_type audio/wav;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "upload_max_filesize=10M\npost_max_size=12M\nmemory_limit=256M";
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
