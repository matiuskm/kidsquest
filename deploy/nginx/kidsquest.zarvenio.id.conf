# Tahap 2 (setelah sertifikat terbit): HTTPS penuh. Cloudflare SSL mode: Full (strict).
server {
    listen 80;
    listen [::]:80;
    server_name kidsquest.zarvenio.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kidsquest/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kidsquest.zarvenio.id;

    ssl_certificate /etc/letsencrypt/live/kidsquest.zarvenio.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kidsquest.zarvenio.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/kidsquest/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location ~* \.wav$ {
        default_type audio/wav;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "upload_max_filesize=10M\npost_max_size=12M\nmemory_limit=256M";
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
